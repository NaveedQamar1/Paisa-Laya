name: SCAFA Workforce validation

on:
  push:
    branches:
      - temporary-k50-attendance-build
    paths:
      - "k50_attendance_build/**"
      - ".github/workflows/scafa-validation.yml"
      - ".github/workflows/scafa-release.yml"
  pull_request:
    paths:
      - "k50_attendance_build/**"
      - ".github/workflows/scafa-validation.yml"
      - ".github/workflows/scafa-release.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r k50_attendance_build/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s k50_attendance_build -p "test_*.py" -v
      - name: Build application and helpers
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SCAFA_Workforce k50_attendance_build/app.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-monitor --collect-all winotify k50_attendance_build/monitor.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-updater k50_attendance_build/updater.py
          Copy-Item dist/scafa-monitor.exe dist/SCAFA_Workforce/scafa-monitor.exe -Force
          Copy-Item dist/scafa-updater.exe dist/SCAFA_Workforce/scafa-updater.exe -Force
        shell: pwsh

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r k50_attendance_build/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s k50_attendance_build -p "test_*.py" -v
      - name: Build application and helpers
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SCAFA_Workforce k50_attendance_build/app.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-monitor k50_attendance_build/monitor.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-updater k50_attendance_build/updater.py
          install -m 755 dist/scafa-monitor dist/SCAFA_Workforce.app/Contents/MacOS/scafa-monitor
          install -m 755 dist/scafa-updater dist/SCAFA_Workforce.app/Contents/MacOS/scafa-updater
