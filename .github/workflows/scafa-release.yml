name: SCAFA Workforce versioned release

on:
  push:
    tags:
      - "scafa-v*"
    branches:
      - "main"
    paths:
      - "k50_attendance_build/**"
      - ".github/workflows/scafa-release.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "k50_attendance_build/**"
      - ".github/workflows/scafa-release.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag; when blank, use APP_VERSION from the app"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows installer
        shell: pwsh
        run: |
          $releaseTag = "${{ github.event.inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($releaseTag)) {
            $versionLine = Select-String -Path "k50_attendance_build/app.py" -Pattern '^APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
            if (-not $versionLine) { throw "APP_VERSION was not found in app.py" }
            $releaseTag = "scafa-v$($versionLine.Matches[0].Groups[1].Value)"
          }
          $version = $releaseTag -replace '^scafa-v',''
          python -m pip install --upgrade pip
          python -m pip install -r k50_attendance_build/requirements.txt
          python -m pip install pillow
          python -c "import base64; from pathlib import Path; from PIL import Image; p=Path('k50_attendance_build/assets'); (p/'scafa_workforce_icon.png').write_bytes(base64.b64decode((p/'scafa_workforce_icon.png.b64').read_text())); Image.open(p/'scafa_workforce_icon.png').save(p/'scafa_workforce_icon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          python -m unittest discover -s k50_attendance_build -p "test_*.py" -v
          python -m PyInstaller --noconfirm --clean --onedir --windowed --collect-data certifi --icon k50_attendance_build/assets/scafa_workforce_icon.ico --add-data "k50_attendance_build/assets/scafa_workforce_icon.png;assets" --name SCAFA_Workforce k50_attendance_build/app.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-monitor --collect-all winotify k50_attendance_build/monitor.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-updater k50_attendance_build/updater.py
          Copy-Item dist/scafa-monitor.exe dist/SCAFA_Workforce/scafa-monitor.exe -Force
          Copy-Item dist/scafa-updater.exe dist/SCAFA_Workforce/scafa-updater.exe -Force
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "k50_attendance_build\installer\SCAFA_Workforce.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: installer-output/SCAFA_Workforce_Setup.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS app
        run: |
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            APP_VERSION="$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' k50_attendance_build/app.py | head -n 1)"
            if [ -z "$APP_VERSION" ]; then echo "APP_VERSION not found"; exit 1; fi
            RELEASE_TAG="scafa-v$APP_VERSION"
          fi
          VERSION="${RELEASE_TAG#scafa-v}"
          python -m pip install --upgrade pip
          python -m pip install -r k50_attendance_build/requirements.txt
          python -m pip install pillow
          python -c "import base64; from pathlib import Path; from PIL import Image; p=Path('k50_attendance_build/assets'); (p/'scafa_workforce_icon.png').write_bytes(base64.b64decode((p/'scafa_workforce_icon.png.b64').read_text())); Image.open(p/'scafa_workforce_icon.png').save(p/'scafa_workforce_icon.icns',format='ICNS',sizes=[(16,16),(32,32),(64,64),(128,128),(256,256),(512,512),(1024,1024)])"
          python -m unittest discover -s k50_attendance_build -p "test_*.py" -v
          python -m PyInstaller --noconfirm --clean --windowed --collect-data certifi --icon k50_attendance_build/assets/scafa_workforce_icon.icns --add-data "k50_attendance_build/assets/scafa_workforce_icon.png:assets" --name SCAFA_Workforce k50_attendance_build/app.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-monitor k50_attendance_build/monitor.py
          python -m PyInstaller --noconfirm --clean --onefile --name scafa-updater k50_attendance_build/updater.py
          install -m 755 dist/scafa-monitor dist/SCAFA_Workforce.app/Contents/MacOS/scafa-monitor
          install -m 755 dist/scafa-updater dist/SCAFA_Workforce.app/Contents/MacOS/scafa-updater
          ditto -c -k --sequesterRsrc --keepParent dist/SCAFA_Workforce.app dist/SCAFA_Workforce_macOS_${{ matrix.arch }}.zip
          if [ "${{ matrix.arch }}" = "intel" ]; then
            pkgbuild --component dist/SCAFA_Workforce.app --install-location /Applications --identifier pk.scafa.workforce --version "$VERSION" dist/SCAFA_Workforce_Installer_Intel.pkg

            # Build a lightweight icon-only package for users who already have SCAFA Workforce installed.
            mkdir -p icon-patch-root/Applications/SCAFA_Workforce.app/Contents/Resources
            cp k50_attendance_build/assets/scafa_workforce_icon.icns icon-patch-root/Applications/SCAFA_Workforce.app/Contents/Resources/scafa_workforce_icon.icns
            mkdir -p icon-patch-scripts
            cp k50_attendance_build/installer/macos-icon-patch-postinstall icon-patch-scripts/postinstall
            chmod 755 icon-patch-scripts/postinstall
            pkgbuild --root icon-patch-root --scripts icon-patch-scripts --identifier pk.scafa.workforce.iconpatch --version "$VERSION" --install-location / dist/SCAFA_Workforce_Icon_Patch_Intel.pkg
            pkgutil --payload-files dist/SCAFA_Workforce_Icon_Patch_Intel.pkg | grep -F "Applications/SCAFA_Workforce.app/Contents/Resources/scafa_workforce_icon.icns"
            # pkgbuild already confirms the postinstall script was added to the package.
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/SCAFA_Workforce_macOS_${{ matrix.arch }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'intel'
        with:
          name: release-macos-intel-installer
          path: dist/SCAFA_Workforce_Installer_Intel.pkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'intel'
        with:
          name: release-macos-intel-icon-patch
          path: dist/SCAFA_Workforce_Icon_Patch_Intel.pkg
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generate checksums and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            APP_VERSION="$(sed -n 's/^APP_VERSION = "\([^"]*\)"/\1/p' k50_attendance_build/app.py | head -n 1)"
            if [ -z "$APP_VERSION" ]; then echo "APP_VERSION not found"; exit 1; fi
            RELEASE_TAG="scafa-v$APP_VERSION"
          fi
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping duplicate publication."
            exit 0
          fi
          : > release-assets/checksums.txt
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            digest="$(sha256sum "$file" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$name" >> release-assets/checksums.txt
          done < <(find release-assets -type f ! -name checksums.txt -print0)
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create "$RELEASE_TAG" "${assets[@]}" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "SCAFA Workforce $RELEASE_TAG" --generate-notes
