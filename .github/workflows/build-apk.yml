name: Build Paisa Laya APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Clean build
        run: gradle clean --stacktrace

      - name: Build debug APK without build cache
        run: gradle assembleDebug --no-build-cache --stacktrace

      - name: Verify APK contents
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          for needle in "People & Dues" "Currency converter" "24K gold only" "PDF invoice" "Google account sync"; do
            if ! unzip -p app/build/outputs/apk/debug/app-debug.apk "classes*.dex" | strings | grep -Fq "$needle"; then
              echo "Missing APK feature string: $needle"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paisa-Laya-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
