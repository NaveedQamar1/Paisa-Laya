name: SCAFA Workforce Windows build and installer
on:
  push:
    branches:
      - temporary-k50-attendance-build
    paths:
      - 'k50_attendance_build/**'
      - '.github/workflows/k50-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r k50_attendance_build/requirements.txt
      - name: Run attendance logic tests
        run: python -m unittest discover -s k50_attendance_build -p "test_*.py" -v
      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name SCAFA_Workforce k50_attendance_build/app.py
          Compress-Archive -Path dist/SCAFA_Workforce/* -DestinationPath dist/SCAFA_Workforce_Portable.zip -Force
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "k50_attendance_build\installer\SCAFA_Workforce.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload installable setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: SCAFA_Workforce_Installer
          path: installer-output/SCAFA_Workforce_Setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload standalone portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SCAFA_Workforce_Portable_EXE
          path: dist/SCAFA_Workforce_Portable.zip
          if-no-files-found: error
          retention-days: 14
