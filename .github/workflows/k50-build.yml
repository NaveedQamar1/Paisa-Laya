name: Temporary K50 Windows EXE build
on:
  push:
    branches:
      - temporary-k50-attendance-build
    paths:
      - 'k50_attendance_build/**'
      - '.github/workflows/k50-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r k50_attendance_build/requirements.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name K50_Attendance_Manager k50_attendance_build/app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: K50_Attendance_Manager_Windows_EXE
          path: dist/K50_Attendance_Manager.exe
          if-no-files-found: error
          retention-days: 7
